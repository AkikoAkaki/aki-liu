title = "Aki's Blog"
baseURL = "/"
enableRobotsTXT = true

defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true

# Content grouping (top-level key: must stay above the first [table]).
mainSections = ["notes", "textlab", "weeknotes"]

[languages]
  [languages.zh]
    languageCode = "zh-CN"
    languageName = "Chinese"
    weight = 1
  [languages.en]
    languageCode = "en"
    languageName = "English"
    weight = 2

[module]
  [module.hugoVersion]
    extended = false
    min = "0.152.0"

[taxonomies]
  tag = "tags"

# Flatten microblog URLs: nested year/month dirs in content stay private.
[permalinks]
  microblog = "/microblog/:slug/"

[outputFormats]
  [outputFormats.searchindex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true
  [outputFormats.microblog_feed]
    mediaType = "application/json"
    baseName = "feed"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "searchindex"]

[params]
  description = "Aki Liu's multilingual blog on engineering, writing, and ideas."
  author = "Aki Liu"
  # Entries per microblog column page, in HTML and in the JSON chunks.
  microblogPageSize = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = true

  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      inline = [['$', '$'], ['\(', '\)']]
      block = [['$$', '$$'], ['\[', '\]']]

  [markup.highlight]
    noClasses = false
    style = "monokai"

  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false

# Publish bundle resources only when a template uses their URL.
# Processed WebP images and local videos remain published; unused originals do not.
[cascade]
  [cascade.build]
    publishResources = false
