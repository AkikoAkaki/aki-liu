# Site
title = "Aki's Blog"
baseURL = "/"
enableRobotsTXT = true

# Language
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false

[languages]
  [languages.zh]
    languageCode = "zh-CN"
    languageName = "Chinese"
    weight = 1
  [languages.en]
    languageCode = "en"
    languageName = "English"
    weight = 2

# Version guard for CI/build platforms.
[module]
  [module.hugoVersion]
    extended = false
    min = "0.152.0"

# Content grouping
mainSections = ["ideas", "technical", "textlab"]

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  # KaTeX global default (page-level overrides are supported in templates).
  enableKaTeX = true
  # Used by SEO meta and structured data.
  description = "Aki Liu's multilingual blog on engineering, writing, and ideas."
  author = "Aki Liu"
  # Optional absolute site URL fallback for local/preview builds.
  # Leave empty in repo and set via environment if needed.
  siteURL = ""
  # Optional fallback social image URL/path for Open Graph and Twitter cards.
  defaultSocialImage = ""

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Allow trusted inline HTML in markdown content.
      unsafe = true
      hardLineBreak = true

  [markup.highlight]
    noClasses = false
    style = "monokai"

  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false