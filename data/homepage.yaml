intro:
  name: "Aki Liu"
  tagline: "AI Systems, Product Thinking, Digital Humanities"
  bio:
    - "Operating at the intersection of AI Infrastructure, Product Engineering, and Humanistic Inquiry. I build hardware-aware distributed systems while critically examining the cultural and ethical protocols of technology."
    - "My engineering background is rooted in real-time AI inference and system reliability (<a href='https://artisk.ai' target='_blank'>Artisk</a>, <a href='https://dentistjourney.com' target='_blank'>Dentist Journey</a>). Beyond systems, I maintain a parallel practice in critical writing—engaging affect theory, psychogeography, East Asian surface culture, and the aesthetics of limit and negation."

