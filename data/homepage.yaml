# Now
# -----------------------------------------------------------------------------
now:
  cards:
    - title: "Focusing Now"
      tagline: "ML systems research on GPU kernel autotuning in Prof. Sreepathi Pai's group, and LLM inference performance on a single GPU."
      paragraphs:
        - "Courses I am taking in Fall 2026:"
      pillars:
        - num: "1"
          title: "CSC 290: Machine Learning Systems for Efficient AI"
          desc: "How ML programs map onto hardware: CPU and GPU architecture, the CUDA model, number formats, memory layout and sparse matrices, computational graphs, loop transformations, autotuning, caches, and virtual memory."

        - num: "2"
          title: "MATH 280: Introduction to Numerical Analysis"
          desc: "Floating-point arithmetic and error propagation, root finding with bisection, Newton, and secant methods, and solving linear systems with LU, pivoting, and Cholesky decompositions."

        - num: "3"
          title: "MATH 208: Operations Research and Linear Optimization"
          desc: "Linear programming: feasible sets and convexity, extreme points, the simplex method with Phase I and Phase II, degeneracy and Bland's rule, and duality."

        - num: "4"
          title: "ECON 208W: Topics in Microeconomic Theory"
          desc: "A writing-intensive course in game theory: Nash equilibrium and Pareto efficiency, mixed strategies, and repeated games."

        - num: "5"
          title: "CSC 273W: Writing for Computer Science"
          desc: "Technical and research writing for computer science."
    - title: "Elsewhere"
      paragraphs:
        - "Writing across affect theory, psychogeography, negative aesthetics, and phenomenology of the body, tracing how sensation, space, and form encode the conditions of contemporary existence."
        - "A fuller <a href='/influences/'>map of influences</a>"
    - title: "What I'm Using"
      pillars:
        - num: "1"
          title: "Fragrances for Spring & Summer"
          desc: "Terre d'Hermès Eau Givrée by Hermès, Colonia Il Profumo by Acqua di Parma, Grey Vetiver by Tom Ford, and Explorer by Montblanc."
        - num: "2"
          title: "Electronics"
          desc: "Apple iPhone 16 Pro (512 GB), ASUS ROG Zephyrus G16 (2023) GU603, Logitech G PRO X SUPERLIGHT 2, Apple iPad Pro 11-inch (2nd generation), Apple AirPods Pro (1st generation)"
        - num: "3"
          title: "Clothing"
          desc: "I've always admired the clothing from brands like Comme des Garçons, Alexander McQueen, Yohji Yamamoto, Prada, Our Legacy, and Ann Demeulemeester, but they're out of my price range. Most of what I own is fast fashion or mainstream brands — primarily Uniqlo and Zara."

