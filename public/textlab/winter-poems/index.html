<span>Text Lab</span></a><h1 class=post-title>冬の十二行詩</h1></div><time class=post-date>2022/12/29</time></header><aside class="post-toc post-toc--inline"><nav id=TableOfContents></nav></aside><div class=post-content><p>你在屏幕上留下
难以抹除的水渍
像那深冬的雪花一般。</p><p>我回到熟悉的酒馆
捧着热腾的空气
眼前的光逐渐散漫。</p><p>看呐，以前经常乘坐的
12 号列车
乘客竟格外地多。</p><p>你消失在窗外
融进行人和黑夜
报纸皱成一团。</p></div></article><script>(function(){const o=document.querySelectorAll(".post-toc");if(!o.length)return;const e=Array.from(document.querySelectorAll(".post-toc a")),t=e.map(e=>{const t=e.getAttribute("href").slice(1);return document.getElementById(t)}).filter(Boolean),i=e=>{const n=e.getAttribute("href").slice(1),t=document.getElementById(n);if(t){const e=t.getBoundingClientRect().top+window.pageYOffset,n=e-window.innerHeight*.25;window.scrollTo({top:n,behavior:"smooth"})}};e.forEach(e=>{e.addEventListener("click",t=>{t.preventDefault(),i(e)})});const s=()=>{let n=null;const s=window.scrollY+window.innerHeight*.26;for(let e=t.length-1;e>=0;e--)if(t[e]&&t[e].offsetTop<=s){n=t[e];break}e.forEach(e=>e.classList.remove("is-active")),n&&e.filter(e=>e.getAttribute("href")===`#${n.id}`).forEach(e=>e.classList.add("is-active"))};let n=!1;window.addEventListener("scroll",()=>{if(n)return;window.requestAnimationFrame(()=>{s(),n=!1}),n=!0}),s()})()</script><footer class=site-footer><div class=footer-left>© 2025 Aki Liu, crafted with inspiration from <a href=https://paco.me target=_blank rel="noopener noreferrer">Paco Coursey</a></div></footer></main><aside class=site-sidebar-right><aside class="post-toc post-toc--sidebar"><nav id=TableOfContents></nav></aside></aside></div></body></html>
