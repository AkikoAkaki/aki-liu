<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aki Liu - Studio</title>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #f0f2f5;
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 32px 16px 48px;
}

#app {
  width: 100%;
  max-width: 1180px;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.04);
}

/* -- Titlebar -- */
#titlebar {
  background: #f9fafb;
  border-bottom: 1px solid #e5e7eb;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  user-select: none;
}
.dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
.dot-r { background: #ff5f57; }
.dot-y { background: #febc2e; }
.dot-g { background: #28c840; }

#tabs {
  display: flex;
  gap: 16px;
  margin: 0 auto;
  transform: translateX(-24px);
}
.tab-btn {
  background: none;
  border: none;
  outline: none;
  font-size: 12px;
  color: #6b7280;
  font-weight: 500;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
  transition: background 0.15s, color 0.15s;
  font-family: inherit;
}
.tab-btn:hover {
  background: #e5e7eb;
  color: #374151;
}
.tab-btn.active {
  background: #edf4f7;
  color: #31566f;
  font-weight: 600;
}

/* -- Meta strip -- */
#meta-strip {
  background: #f9fafb;
  border-bottom: 1px solid #e5e7eb;
  padding: 7px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11.5px;
  color: #9ca3af;
}
#status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 5px rgba(34,197,94,.45);
  flex-shrink: 0;
}
#slug-display { font-family: 'Menlo', 'Consolas', monospace; color: #c4c9d4; font-size: 11px; }
#git-status { margin-left: auto; font-size: 10.5px; }
.status-strip {
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  flex-wrap: wrap;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1px solid #e5e7eb;
  background: #fff;
  color: #6b7280;
  border-radius: 999px;
  padding: 2px 8px;
  font-size: 10.5px;
  line-height: 1.4;
  white-space: nowrap;
}
.status-pill.is-main,
.status-pill.is-dirty,
.status-pill.is-nopush {
  border-color: #d8e3e8;
  background: #f5f9fb;
  color: #31566f;
}
.status-pill.is-clean {
  color: #64748b;
}

/* -- Split pane -- */
#split {
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.pane {
  display: flex;
  flex-direction: column;
  min-height: 260px;
}

#preview-pane { border-left: 1px solid #e5e7eb; }

.pane-label {
  padding: 6px 18px;
  font-size: 10px;
  font-weight: 700;
  color: #d1d5db;
  letter-spacing: .1em;
  text-transform: uppercase;
  background: #fafafa;
  border-bottom: 1px solid #f3f4f6;
  flex-shrink: 0;
  min-height: 29px;
  display: flex;
  align-items: center;
}

.pane-label-tabs {
  padding: 0 10px;
  background: #fafafa;
  border-bottom: 1px solid #f3f4f6;
  display: flex;
  gap: 2px;
  flex-shrink: 0;
  min-height: 29px;
}
.pane-subtab {
  background: none;
  border: none;
  outline: none;
  padding: 0 12px;
  font-size: 10px;
  font-weight: 700;
  color: #9ca3af;
  letter-spacing: .05em;
  text-transform: uppercase;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  height: 29px;
  line-height: 29px;
  font-family: inherit;
}
.pane-subtab:hover {
  color: #4b5563;
}
.pane-subtab.active {
  color: #2563eb;
  border-bottom-color: #2563eb;
}

/* -- Editor inputs -- */
.editor-title-input {
  width: 100%;
  border: none;
  border-bottom: 1px solid #f3f4f6;
  outline: none;
  padding: 14px 20px;
  font-size: 15px;
  font-weight: 600;
  color: #111827;
  font-family: inherit;
}
.editor-title-input::placeholder {
  color: #d1d5db;
}

/* -- Editor -- */
.editor-textarea {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  overflow-y: auto;
  padding: 18px 20px;
  font-family: 'Menlo', 'Consolas', monospace;
  font-size: 13px;
  line-height: 1.85;
  color: #374151;
  background: transparent;
  min-height: 280px;
  display: block;
  width: 100%;
}
.editor-textarea::placeholder { color: #d1d5db; }

/* -- Drop hint -- */
#drop-hint {
  padding: 7px 18px;
  font-size: 10.5px;
  color: #d1d5db;
  border-top: 1px dashed #e5e7eb;
  background: #fafafa;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  transition: background .15s, color .15s, border-color .15s;
}
#drop-hint.active {
  background: #eff6ff;
  color: #3b82f6;
  border-top-color: #bfdbfe;
}

/* -- Preview -- */
#preview-body {
  flex: 1;
  padding: 18px 20px;
  min-height: 280px;
}
#preview {
  font-size: 14px;
  line-height: 1.85;
  color: #374151;
  word-break: break-word;
}
#preview p { margin-bottom: 12px; }
#preview p:last-child { margin-bottom: 0; }
#preview strong { color: #111827; }
#preview em { color: #6366f1; }
#preview a { color: #3b82f6; text-decoration: none; border-bottom: 1px solid #bfdbfe; }
#preview a:hover { color: #1d4ed8; border-bottom-color: #93c5fd; }
#preview h1, #preview h2, #preview h3 { color: #111827; margin: 16px 0 8px; font-weight: 700; }
#preview h1 { font-size: 18px; }
#preview h2 { font-size: 16px; }
#preview h3 { font-size: 14px; }
#preview blockquote {
  border-left: 3px solid #e5e7eb;
  padding: 2px 0 2px 14px;
  color: #6b7280;
  margin: 10px 0;
}
#preview code {
  background: #f3f4f6;
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 12px;
  font-family: 'Menlo', monospace;
  color: #374151;
}
#preview pre {
  background: #f3f4f6;
  padding: 14px 16px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 10px 0;
}
#preview pre code { background: none; padding: 0; }
#preview img {
  max-width: 100%;
  border-radius: 6px;
  margin: 8px 0;
  display: block;
}
#preview hr { border: none; border-top: 1px solid #e5e7eb; margin: 16px 0; }
#preview ul, #preview ol { padding-left: 20px; margin-bottom: 12px; }
#preview li { margin-bottom: 4px; }

#preview-placeholder {
  color: #d1d5db;
  font-size: 13px;
  font-style: italic;
}

#preview-spacer {
  height: 35px;
  flex-shrink: 0;
  border-top: 1px solid transparent;
}

/* -- Meta Pane for Articles -- */
#meta-pane {
  padding: 18px 20px;
  flex: 1;
  min-height: 280px;
  overflow-y: auto;
}
.meta-field {
  margin-bottom: 16px;
}
.meta-field.inline {
  display: inline-flex;
  align-items: center;
  margin-bottom: 0;
}
.meta-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: #6b7280;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.meta-input {
  width: 100%;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 13px;
  color: #374151;
  outline: none;
  background: #fafafa;
  font-family: inherit;
  transition: border-color 0.15s;
}
.meta-input:focus {
  border-color: #93c5fd;
}
.meta-checkbox {
  width: 14px;
  height: 14px;
  accent-color: #2563eb;
  cursor: pointer;
}
.meta-checkbox-label {
  font-size: 12.5px;
  color: #374151;
  margin-left: 6px;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
}
.meta-row {
  display: flex;
  align-items: center;
  margin-top: 8px;
}

/* -- Manager Layout -- */
#manager-container {
  width: 100%;
  grid-column: span 2;
  display: grid;
  grid-template-columns: 1fr 1fr;
}
#manager-list-pane {
  border-right: 1px solid #e5e7eb;
}
#manager-list {
  flex: 1;
  overflow-y: auto;
  max-height: 520px;
}
.manager-item {
  padding: 12px 16px;
  border-bottom: 1px solid #f3f4f6;
  cursor: pointer;
  transition: background 0.15s;
}
.manager-item:hover {
  background: #f9fafb;
}
.manager-item.active {
  background: #eff6ff;
  border-left: 3px solid #2563eb;
  padding-left: 13px;
}
.manager-item-title {
  font-size: 12.5px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 4px;
  word-break: break-all;
}
.manager-item-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10.5px;
  color: #9ca3af;
}
.badge {
  display: inline-block;
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
}
.badge-microblog { background: #f3f4f6; color: #4b5563; }
.badge-ideas     { background: #eff6ff; color: #2563eb; }
.badge-notes     { background: #ecfdf5; color: #059669; }
.badge-textlab   { background: #fdf2f8; color: #db2777; }
.badge-influences{ background: #fff7ed; color: #ea580c; }
.badge-draft     { background: #fff1f2; color: #e11d48; border: 1px solid #ffe4e6; }

#manager-preview-pane {
  background: #fff;
}
#manager-preview-body {
  flex: 1;
  overflow-y: auto;
  max-height: 520px;
  padding: 18px 20px;
}
.mgr-action-btn {
  background: none;
  border: 1px solid #e5e7eb;
  border-radius: 5px;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  font-family: inherit;
}
.mgr-action-btn.edit-btn {
  color: #2563eb;
  border-color: #bfdbfe;
}
.mgr-action-btn.edit-btn:hover {
  background: #eff6ff;
  border-color: #93c5fd;
}
.mgr-action-btn.delete-btn {
  color: #dc2626;
  border-color: #fecaca;
  margin-left: 6px;
}
.mgr-action-btn.delete-btn:hover {
  background: #fef2f2;
  border-color: #fca5a5;
}

/* -- Content Studio Library -- */
#library-container {
  grid-column: span 2;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(360px, .92fr);
  min-height: 650px;
  background: #fbfcfd;
}
#library-pane {
  border-right: 1px solid #e6ecef;
  min-width: 0;
}
.library-top {
  padding: 28px 30px 22px;
  border-bottom: 1px solid #e6ecef;
  background: linear-gradient(180deg, #ffffff 0%, #fbfcfd 100%);
}
.library-kicker {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #8aa0ad;
  margin-bottom: 8px;
}
.library-heading-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
}
.library-title {
  font-size: 26px;
  line-height: 1.15;
  font-weight: 650;
  color: #18242c;
  letter-spacing: 0;
}
.library-count {
  color: #7b8b96;
  font-size: 12px;
  white-space: nowrap;
  padding-bottom: 3px;
}
.library-controls {
  margin-top: 22px;
  display: grid;
  grid-template-columns: minmax(180px, 1fr) 150px 132px;
  gap: 10px;
}
.library-input,
.library-select {
  width: 100%;
  border: 1px solid #dbe3e7;
  border-radius: 8px;
  background: #fff;
  color: #334155;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.library-input {
  padding: 10px 12px;
}
.library-select {
  padding: 9px 10px;
}
.library-input:focus,
.library-select:focus {
  border-color: #9fb8c5;
  box-shadow: 0 0 0 3px rgba(100, 132, 149, .13);
}
.library-list {
  max-height: 532px;
  overflow-y: auto;
  padding: 12px;
}
.library-item {
  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 10px;
  padding: 16px 17px;
  cursor: pointer;
  font-family: inherit;
  transition: background .15s, border-color .15s, box-shadow .15s;
}
.library-item + .library-item {
  margin-top: 6px;
}
.library-item:hover,
.library-item:focus-visible {
  background: #fff;
  border-color: #dfe8ec;
  box-shadow: 0 6px 18px rgba(39, 57, 68, .05);
  outline: none;
}
.library-item.active {
  background: #f6fafb;
  border-color: #bfd0d9;
  box-shadow: inset 3px 0 0 #6f8ea0;
}
.library-item-top {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
}
.library-item-title {
  font-size: 15px;
  font-weight: 650;
  color: #18242c;
  line-height: 1.45;
  word-break: break-word;
}
.library-item-title-en {
  margin-top: 3px;
  font-size: 12.5px;
  color: #6b7c86;
  line-height: 1.45;
}
.library-item-date {
  color: #91a0aa;
  font-size: 11px;
  white-space: nowrap;
  padding-top: 3px;
}
.library-item-meta {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.cs-badge {
  display: inline-flex;
  align-items: center;
  border: 1px solid #dbe3e7;
  background: #fff;
  color: #60737f;
  border-radius: 999px;
  padding: 2px 7px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .03em;
  text-transform: uppercase;
}
.cs-badge.kind {
  background: #edf4f7;
  border-color: #d6e2e8;
  color: #426273;
}
.cs-badge.draft {
  background: #fff7ed;
  border-color: #fed7aa;
  color: #9a5a16;
}
.cs-badge.en {
  background: #f5f7f9;
  color: #667985;
}
.library-tags {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}
.library-tag {
  color: #71838e;
  font-size: 11px;
}
.library-excerpt {
  margin-top: 10px;
  color: #4b5f6b;
  font-size: 12.5px;
  line-height: 1.6;
}
.library-url {
  margin-top: 8px;
  color: #91a0aa;
  font-size: 11px;
  font-family: 'Menlo', 'Consolas', monospace;
  word-break: break-all;
}
.library-empty,
.library-loading,
.library-error {
  padding: 44px 20px;
  text-align: center;
  color: #8a9aa5;
  font-size: 13px;
}
.library-error {
  color: #b45309;
}
#library-detail-pane {
  background: #fff;
  min-width: 0;
}
.detail-empty {
  min-height: 650px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #9aa7af;
  font-size: 13px;
  padding: 24px;
}
.detail-shell {
  min-height: 650px;
  display: flex;
  flex-direction: column;
}
.detail-header {
  padding: 28px 30px 20px;
  border-bottom: 1px solid #e6ecef;
  background: #fff;
}
.detail-title {
  font-size: 22px;
  line-height: 1.3;
  color: #18242c;
  font-weight: 650;
  letter-spacing: 0;
}
.detail-title-en {
  margin-top: 5px;
  color: #6b7c86;
  font-size: 13px;
  line-height: 1.5;
}
.detail-meta {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 13px;
}
.detail-url-row {
  margin-top: 14px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.detail-url {
  min-width: 0;
  flex: 1;
  color: #758792;
  background: #f7fafb;
  border: 1px solid #e2eaee;
  border-radius: 7px;
  padding: 7px 9px;
  font-size: 11px;
  font-family: 'Menlo', 'Consolas', monospace;
  word-break: break-all;
}
.copy-url-btn {
  border: 1px solid #d6e2e8;
  background: #fff;
  color: #486878;
  border-radius: 7px;
  padding: 7px 10px;
  font-size: 11px;
  font-weight: 650;
  font-family: inherit;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.copy-url-btn:hover {
  background: #f4f8fa;
  border-color: #bfd0d9;
}
.detail-body {
  overflow-y: auto;
  max-height: 475px;
  padding: 24px 30px 30px;
}
.detail-section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .14em;
  color: #9aa7af;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.detail-markdown {
  color: #334155;
  font-size: 14px;
  line-height: 1.85;
}
.detail-markdown p { margin-bottom: 13px; }
.detail-markdown p:last-child { margin-bottom: 0; }
.detail-markdown a { color: #456f86; text-decoration: none; border-bottom: 1px solid #c8d8df; }
.detail-markdown blockquote {
  margin: 12px 0;
  border-left: 3px solid #dbe3e7;
  padding: 3px 0 3px 14px;
  color: #62737e;
}
.detail-markdown code {
  background: #f3f6f8;
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 12px;
}
.detail-markdown pre {
  background: #f3f6f8;
  border-radius: 8px;
  padding: 14px;
  overflow-x: auto;
  margin: 12px 0;
}
.detail-markdown pre code { padding: 0; }
.detail-markdown img {
  max-width: 100%;
  border-radius: 7px;
  margin: 10px 0;
}
.detail-divider {
  border: none;
  border-top: 1px dashed #dbe3e7;
  margin: 24px 0;
}
.detail-path {
  margin-top: 18px;
  color: #9aa7af;
  font-size: 11px;
  font-family: 'Menlo', 'Consolas', monospace;
  word-break: break-all;
}

/* -- Content Studio Editor View -- */
.editor-view-shell {
  display: flex;
  flex-direction: column;
  min-height: 650px;
}
.editor-view-header {
  padding: 26px 30px 20px;
  border-bottom: 1px solid #e6ecef;
  background: #fff;
  flex-shrink: 0;
}
.editor-back {
  display: none;
  margin-bottom: 14px;
}
.editor-back-btn {
  background: none;
  border: none;
  padding: 0;
  color: #7a9aaa;
  font-size: 11.5px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: color .15s;
}
.editor-back-btn:hover {
  color: #2e6478;
}
.editor-view-title {
  font-size: 22px;
  line-height: 1.3;
  color: #18242c;
  font-weight: 650;
  letter-spacing: 0;
}
.editor-view-subtitle {
  margin-top: 5px;
  color: #6b7c86;
  font-size: 13px;
  line-height: 1.5;
}
.editor-view-meta {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 13px;
}
.editor-view-tabs-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px 0 12px;
  background: #fafbfc;
  border-bottom: 1px solid #e6ecef;
  flex-shrink: 0;
  min-height: 36px;
}
.editor-lang-tabs {
  display: flex;
}
.editor-lang-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  outline: none;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 600;
  color: #8a9aa5;
  cursor: pointer;
  padding: 0 12px;
  height: 36px;
  letter-spacing: .02em;
  transition: color .15s, border-color .15s;
}
.editor-lang-tab:hover {
  color: #3a6070;
}
.editor-lang-tab.active {
  color: #2e6478;
  border-bottom-color: #5e8fa3;
}
.editor-mode-toggle {
  display: flex;
  align-items: center;
  border: 1px solid #dbe3e7;

}

}
.editor-mode-btn + .editor-mode-btn {

}
.editor-view-body {

.editor-body-empty {

  border: 1px solid #e6ecef;

}
.editor-view-caveat {
  margin-top: 20px;
  color: #b0bec5;
  font-size: 10.5px;
  font-style: italic;
  border-top: 1px dashed #dfe8ec;
  padding-top: 10px;
}
.editor-view-path {
  margin-top: 12px;
  color: #9aa7af;
  font-size: 11px;
  font-family: 'Menlo', 'Consolas', monospace;

}

@media (max-width: 900px) {
  body {
    padding: 16px 10px 28px;
  }
  #tabs {
    gap: 6px;

    margin-left: auto;

  #library-container {

/* -- Bottom bar -- */
#bottom-bar {

.chip-x:hover { color: #2563eb; }

#tag-input {

#publish-btn {

}
</style>
</head>
<body>

<div id="app">
  <!-- Titlebar -->

    <!-- Content Studio Library -->

          <div class="library-heading-row">
            <h1 class="library-title">Library</h1>

          </div>
          <div class="library-controls">

            <select id="library-section-filter" class="library-select" aria-label="Section filter">

    <!-- Editor Pane -->

      <!-- Article sub-tab selectors (Zh / En / Meta) -->
      <div id="article-editor-tabs" class="pane-label-tabs" style="display: none;">

      <input type="text" id="article-title-en" class="editor-title-input" placeholder="英文标题 (English Title)..." autocomplete="off" style="display: none;">

      <!-- Textareas for Chinese and English -->
      <textarea id="editor" class="editor-textarea" placeholder="写点什么……" spellcheck="false"></textarea>
      <textarea id="editor-en" class="editor-textarea" placeholder="Write english translation here..." spellcheck="false" style="display: none;"></textarea>

      <!-- Article metadata editor panel -->
      <div id="meta-pane" style="display: none;">
        <div class="meta-field">

    <!-- Unified Manager Container (spans full split width) -->

      <!-- Left List of posts -->
      <div class="pane" id="manager-list-pane">
        <div class="pane-label">所有稿件</div>
        <div style="padding: 10px 16px; border-bottom: 1px solid #f3f4f6;">
          <input type="text" id="manager-search" placeholder="检索标题、标签、内容..." style="width: 100%; border: 1px solid #e5e7eb; border-radius: 6px; padding: 6px 10px; font-size: 12px; outline: none; background: #fafafa;" autocomplete="off">
        </div>
        <div id="manager-list"></div>

      <!-- Right detailed view -->

          <span>稿件预览</span>

            选择左侧稿件查看预览
          </div>

    </div>
    <button id="publish-btn">发布 ↑</button>

  <div id="status-msg"></div>
</div>

<script>
// -- State --
let tags = [];
let existingTags = [];
let currentTab = 'library'; // library, microblog, article, manager
let articleEditorSubtab = 'zh'; // zh, en, meta
let articlePreviewLang = 'zh'; // zh, en
let allPosts = [];
let selectedPost = null;
let editingRelPath = null; // null if creating new, string if editing
let contentItems = [];
let filteredContentItems = [];
let selectedContentItemId = null;
let selectedDetail = null;
let selectedLanguage = 'zh';
let selectedViewMode = 'preview';

// -- Markdown renderer with image proxy --
function setupMarked() {
  if (typeof marked === 'undefined') return;
  const renderer = new marked.Renderer();
  const origImage = renderer.image.bind(renderer);
  renderer.image = function(href, title, text) {
    const src = /^https?:\/\//.test(href) ? href : `/uploads/${href}`;
    return `<img src="${src}" alt="${text || ''}" title="${title || ''}">`;
  };
  marked.use({ renderer, breaks: true });
}
setupMarked();

function renderMarkdown(md) {
  if (typeof marked !== 'undefined') return marked.parse(md);
  return '<p>' + md
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .split(/\n\n+/).join('</p><p>')
    .replace(/\n/g, '<br>') + '</p>';
}

// -- Clock & slug --
const clockEl = document.getElementById('clock');
const slugEl  = document.getElementById('slug-display');
const days    = ['日','一','二','三','四','五','六'];

function updateClock() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  clockEl.textContent = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} · 周${days[now.getDay()]} · ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  if (!editingRelPath) {
    slugEl.textContent  = `slug: ${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  } else {
    slugEl.textContent  = `编辑: ${editingRelPath.split('/').slice(-2).join('/')}`;
  }
}
setInterval(updateClock, 1000);
updateClock();

// -- Load tags --
function loadTags() {
  fetch('/api/tags')
    .then(r => r.json())
    .then(data => {
      existingTags = data.tags || [];
      const dl = document.getElementById('tag-list');
      dl.innerHTML = existingTags.map(t => `<option value="${t}">`).join('');
    })
    .catch(() => {});
}
loadTags();

// -- Read-only repository status strip --
const gitStatusEl = document.getElementById('git-status');

async function loadRepoStatus() {
  try {
    const res = await fetch('/api/status');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const status = await res.json();
    const pills = [
      `<span class="status-pill">branch ${escHtml(status.branch || 'unknown')}</span>`,
      status.isMain ? '<span class="status-pill is-main">main</span>' : '',
      status.dirty ? '<span class="status-pill is-dirty">dirty</span>' : '<span class="status-pill is-clean">clean</span>',
      status.noPush ? '<span class="status-pill is-nopush">no-push</span>' : '',
      status.lastCommit ? `<span class="status-pill">${escHtml(status.lastCommit)}</span>` : '',
    ].filter(Boolean);
    gitStatusEl.innerHTML = `<span class="status-strip">${pills.join('')}</span>`;
  } catch (_) {
    gitStatusEl.innerHTML = '<span class="status-strip"><span class="status-pill">status unavailable</span></span>';
  }
}
loadRepoStatus();
setInterval(loadRepoStatus, 30000);

// -- Tag chip management --
function addTag(raw) {
  const tag = raw.trim().replace(/^#+/, '').trim();
  if (!tag || tags.includes(tag)) return;
  tags.push(tag);
  renderChips();
}

function removeTag(tag) {
  tags = tags.filter(t => t !== tag);
  renderChips();
}

function renderChips() {
  const area = document.getElementById('chips');
  area.innerHTML = tags.map(t =>
    `<span class="chip"># ${escHtml(t)}<button class="chip-x" data-tag="${escHtml(t)}" title="删除标签">×</button></span>`
  ).join('');
  area.querySelectorAll('.chip-x').forEach(btn => {
    btn.addEventListener('click', () => removeTag(btn.dataset.tag));
  });
}

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  return escHtml(s).replace(/'/g, '&#39;');
}

function itemTitle(item) {
  return (item.title && item.title.zh) || (item.title && item.title.en) || '(untitled)';
}

function itemTitleEn(item) {
  return (item.title && item.title.en) || '';
}

function itemDate(item) {
  return (item.date || '').split('T')[0] || '';
}

function itemSearchText(item) {
  return [
    itemTitle(item),
    itemTitleEn(item),
    item.section,
    item.kind,
    item.excerpt,
    item.url,
    (item.tags || []).join(' '),
    item.searchText,
  ].filter(Boolean).join(' ').toLowerCase();
}

function renderContentBadges(item) {
  return [
    `<span class="cs-badge">${escHtml(item.section)}</span>`,
    `<span class="cs-badge kind">${escHtml(item.kind)}</span>`,
    item.draft ? '<span class="cs-badge draft">draft</span>' : '',
    item.hasEnglish ? '<span class="cs-badge en">EN</span>' : '',
  ].filter(Boolean).join('');
}

function renderLibraryTags(tagsList, limit = 5) {
  const tagsToShow = (tagsList || []).slice(0, limit);
  if (!tagsToShow.length) return '';
  const extra = tagsList.length > limit ? `<span class="library-tag">+${tagsList.length - limit}</span>` : '';
  return `<span class="library-tags">${tagsToShow.map(tag => `<span class="library-tag">#${escHtml(tag)}</span>`).join('')}${extra}</span>`;
}

function applyLibraryFilters() {
  const query = document.getElementById('library-search').value.trim().toLowerCase();
  const section = document.getElementById('library-section-filter').value;
  const status = document.getElementById('library-status-filter').value;

  filteredContentItems = contentItems.filter(item => {
    if (section !== 'all' && item.section !== section) return false;
    if (status === 'drafts' && !item.draft) return false;
    if (status === 'published' && item.draft) return false;
    if (query && !itemSearchText(item).includes(query)) return false;
    return true;
  });

  renderLibraryList();
}

function renderLibraryList() {
  const listEl = document.getElementById('library-list');
  const countEl = document.getElementById('library-count');
  countEl.textContent = `${filteredContentItems.length} of ${contentItems.length} items`;

  if (!filteredContentItems.length) {
    listEl.innerHTML = '<div class="library-empty">No matching items</div>';
    return;
  }

  listEl.innerHTML = filteredContentItems.map(item => {
    const active = item.id === selectedContentItemId ? ' active' : '';
    const titleEn = itemTitleEn(item);
    const tagsHtml = renderLibraryTags(item.tags || []);

    return `
      <button class="library-item${active}" type="button" data-id="${escAttr(item.id)}">
        <div class="library-item-top">
          <div>
            <div class="library-item-title">${escHtml(itemTitle(item))}</div>
            ${titleEn ? `<div class="library-item-title-en">${escHtml(titleEn)}</div>` : ''}
          </div>
          <div class="library-item-date">${escHtml(itemDate(item))}</div>
        </div>
        <div class="library-item-meta">
          ${renderContentBadges(item)}
          ${tagsHtml}
        </div>
        ${item.excerpt ? `<div class="library-excerpt">${escHtml(item.excerpt)}</div>` : ''}
        <div class="library-url">${escHtml(item.url || '')}</div>
      </button>
    `;
  }).join('');

  listEl.querySelectorAll('.library-item').forEach(row => {
    row.addEventListener('click', () => selectContentItem(row.dataset.id));
  });
}

async function loadContentLibrary(force = false) {
  if (contentItems.length && !force) {
    applyLibraryFilters();
    return;
  }

  const listEl = document.getElementById('library-list');
  listEl.innerHTML = '<div class="library-loading">Loading library...</div>';

  try {
    const res = await fetch('/api/content');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    contentItems = Array.isArray(data) ? data : (data.items || []);
    filteredContentItems = contentItems;
    applyLibraryFilters();

    if (!selectedContentItemId && contentItems.length) {
      selectContentItem(contentItems[0].id);
    }
  } catch (err) {
    listEl.innerHTML = `<div class="library-error">Library unavailable: ${escHtml(err.message)}</div>`;
    document.getElementById('library-count').textContent = '0 items';
  }
}

function isMicroblog(item) {
  return item.kind === 'microblog';
}

function renderEditorMeta(item) {
  const mb = isMicroblog(item);
  const parts = [
    `<span class="cs-badge">${escHtml(item.section)}</span>`,
    !mb ? `<span class="cs-badge kind">${escHtml(item.kind)}</span>` : '',
    item.draft ? '<span class="cs-badge draft">draft</span>' : '',
    !mb && item.hasEnglish ? '<span class="cs-badge en">EN</span>' : '',
    item.date ? `<span class="cs-badge">${escHtml(itemDate(item))}</span>` : '',
  ].filter(Boolean);
  return parts.join('') + renderLibraryTags(item.tags || [], 8);
}

function renderEditorHeader(detail) {
  const item = detail.item;
  const mb = isMicroblog(item);
  const zhTitle = itemTitle(item);
  const enTitle = itemTitleEn(item);
  return `
    <div class="editor-view-header">
      <div class="editor-back">
        <button class="editor-back-btn" type="button" id="editor-back-btn">← Library</button>
      </div>
      <div class="editor-view-title">${escHtml(zhTitle)}</div>
      ${!mb && enTitle ? `<div class="editor-view-subtitle">${escHtml(enTitle)}</div>` : ''}
      <div class="editor-view-meta">${renderEditorMeta(item)}</div>
      ${item.url ? `
        <div class="detail-url-row">
          <div class="detail-url">${escHtml(item.url)}</div>
          <button class="copy-url-btn" type="button" id="copy-url-btn" data-url="${escAttr(item.url)}">Copy URL</button>
        </div>
      ` : ''}
    </div>
  `;
}

function renderEditorTabs(detail) {
  const item = detail.item;
  const files = detail.files || {};
  const mb = isMicroblog(item);
  const showEnTab = !mb || !!files.en;
  const zhActive = selectedLanguage === 'zh' ? ' active' : '';
  const enActive = selectedLanguage === 'en' ? ' active' : '';
  const previewActive = selectedViewMode === 'preview' ? ' active' : '';
  const markdownActive = selectedViewMode === 'markdown' ? ' active' : '';
  return `
    <div class="editor-view-tabs-row">
      <div class="editor-lang-tabs">
        <button class="editor-lang-tab${zhActive}" type="button" data-lang="zh">中文</button>
        ${showEnTab ? `<button class="editor-lang-tab${enActive}" type="button" data-lang="en">English</button>` : ''}
      </div>
      <div class="editor-mode-toggle">
        <button class="editor-mode-btn${previewActive}" type="button" data-mode="preview">Preview</button>
        <button class="editor-mode-btn${markdownActive}" type="button" data-mode="markdown">Markdown</button>
      </div>
    </div>
  `;
}

function renderEditorBody(detail) {
  const item = detail.item;
  const files = detail.files || {};
  const zhFile = files.zh || {};
  const enFile = files.en || null;
  let bodyHtml = '';
  let showCaveat = false;

  if (selectedLanguage === 'en') {
    if (!enFile || !enFile.body) {
      bodyHtml = '<div class="editor-body-empty">No English version yet.</div>';
    } else if (selectedViewMode === 'preview') {
      bodyHtml = `<div class="editor-body-content detail-markdown">${renderMarkdown(enFile.body)}</div>`;
      showCaveat = true;
    } else {
      bodyHtml = `<pre class="editor-body-raw">${escHtml(enFile.body)}</pre>`;
    }
  } else {
    const body = zhFile.body || '';
    if (!body.trim()) {
      bodyHtml = '<div class="editor-body-empty">(empty)</div>';
    } else if (selectedViewMode === 'preview') {
      bodyHtml = `<div class="editor-body-content detail-markdown">${renderMarkdown(body)}</div>`;
      showCaveat = true;
    } else {
      bodyHtml = `<pre class="editor-body-raw">${escHtml(body)}</pre>`;
    }
  }

  const pathStr = item.path || zhFile.path || '';
  return `
    <div class="editor-view-body">
      ${bodyHtml}
      ${showCaveat ? '<p class="editor-view-caveat">Approximate preview; Hugo shortcodes may render differently.</p>' : ''}
      ${pathStr ? `<div class="editor-view-path">${escHtml(pathStr)}</div>` : ''}
    </div>
  `;
}

function renderEditorShell(detail) {
  return `
    <div class="editor-view-shell">
      ${renderEditorHeader(detail)}
      ${renderEditorTabs(detail)}
      ${renderEditorBody(detail)}
    </div>
  `;
}

// -- Image Drag / Drop and Paste handlers --
const dropHint = document.getElementById('drop-hint');

[editor, editorEn].forEach(ed => {
  ed.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    dropHint.classList.add('active');
  });
  ed.addEventListener('dragleave', () => dropHint.classList.remove('active'));
  ed.addEventListener('drop', e => {
    e.preventDefault();
    dropHint.classList.remove('active');
    const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
    files.forEach(f => uploadImage(f, ed));
  });
  ed.addEventListener('paste', e => {
    const imageItems = [...e.clipboardData.items].filter(i => i.type.startsWith('image/'));
    if (imageItems.length === 0) return;
    e.preventDefault();
    imageItems.forEach(item => {
      const file = item.getAsFile();
      if (file) uploadImage(file, ed);
    });
  });
});

async function uploadImage(file, targetEditor) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const base64 = reader.result.split(',')[1];
        const res = await fetch('/api/upload-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: file.name, data: base64 }),
        });
        const { filename, error } = await res.json();
        if (error) throw new Error(error);

        const insertion = `![](${filename})`;
        const start = targetEditor.selectionStart;
        const end   = targetEditor.selectionEnd;
        const before = targetEditor.value.slice(0, start);
        const after  = targetEditor.value.slice(end);
        const sep = before && !before.endsWith('\n') ? '\n' : '';
        targetEditor.value = before + sep + insertion + '\n' + after;
        targetEditor.selectionStart = targetEditor.selectionEnd = start + sep.length + insertion.length + 1;
        targetEditor.dispatchEvent(new Event('input'));
      } catch (err) {
        showError('图片上传失败：' + err.message);
      }
      resolve();
    };
    reader.readAsDataURL(file);
  });
}

function renderManagerList(postsList) {
  if (postsList.length === 0) {
    mList.innerHTML = '<div style="padding:20px; color:#9ca3af; font-size:12px; text-align:center;">无稿件</div>';
    return;
  }
  
  mList.innerHTML = postsList.map((post, idx) => {
    const sectionBadge = `<span class="badge badge-${post.section}">${post.section}</span>`;
    const draftBadge = post.draft ? '<span class="badge badge-draft">草稿</span>' : '';
    const name = post.type === 'microblog' 
      ? `微微博 ${post.dirName.slice(3)}`
      : (post.title || post.slug || '未命名');
    
    return `
      <div class="manager-item" data-idx="${idx}">
        <div class="manager-item-title">${escHtml(name)}</div>
        <div class="manager-item-meta">
          ${sectionBadge}
          ${draftBadge}
          <span>${post.date.split('T')[0]}</span>
        </div>
      </div>
    `;
  }).join('');
  
  mList.querySelectorAll('.manager-item').forEach(el => {
    el.addEventListener('click', () => {
      mList.querySelectorAll('.manager-item').forEach(item => item.classList.remove('active'));
      el.classList.add('active');

      selectPostInManager(post);

    p.title.toLowerCase().includes(q) ||
    p.titleEn.toLowerCase().includes(q) ||
    p.content.toLowerCase().includes(q) ||
    p.contentEn.toLowerCase().includes(q) ||
    p.tags.some(t => t.toLowerCase().includes(q)) ||
    p.section.toLowerCase().includes(q)

// -- Publish submission --
const statusMsg  = document.getElementById('status-msg');

function showError(msg) {
  statusMsg.textContent = msg;
  statusMsg.className = 'error';
}
function showSuccess(msg) {
  statusMsg.textContent = msg;
  statusMsg.className = 'success';
}
function clearStatus() {
  statusMsg.className = '';
  statusMsg.textContent = '';
}

publishBtn.addEventListener('click', async () => {
  const content = editor.value.trim();
  if (currentTab === 'microblog' && !content) {
    editor.focus();
    return;
  }
  if (currentTab === 'article') {
    const titleZh = articleTitleZh.value.trim();
    if (!titleZh) {
      switchEditorSubtab('zh');
      articleTitleZh.focus();
      return;
    }
    if (!content) {
      switchEditorSubtab('zh');
      editor.focus();
      return;
    }
  }

  clearStatus();
  publishBtn.disabled = true;
  const origBtnText = publishBtn.textContent;
  publishBtn.textContent = '处理中...';
  publishBtn.className = '';

  const payload = {
    type: currentTab,
    relPath: editingRelPath,
    tags
  };

  if (currentTab === 'microblog') {
    payload.content = content;
    payload.draft = false;
  } else {
    payload.section = document.getElementById('article-section').value;
    payload.title = articleTitleZh.value.trim();
    payload.titleEn = articleTitleEn.value.trim();
    payload.content = content;
    payload.contentEn = editorEn.value.trim();
    payload.draft = document.getElementById('article-draft').checked;
    payload.math = document.getElementById('article-math').checked;
    payload.date = document.getElementById('article-date').value || undefined;
  }

  try {
    const res = await fetch('/api/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    if (data.ok) {
      publishBtn.textContent = '成功';
      publishBtn.classList.add('success');
      if (data.message) showSuccess(data.message);
      setTimeout(() => {
        resetEditors();
        publishBtn.disabled = false;
        publishBtn.textContent = '发布 ↑';
        publishBtn.className = '';
        loadTags();
        if (editingRelPath) {
          switchTab('manager');
        } else {
          switchTab(currentTab);
        }
      }, 2000);
    } else {
      publishBtn.textContent = '失败';
      publishBtn.classList.add('error');
      showError('提交失败：' + data.error);
      setTimeout(() => {
        publishBtn.disabled = false;
        publishBtn.textContent = origBtnText;
        publishBtn.className = '';
      }, 3000);
    }
  } catch (e) {
    publishBtn.textContent = '失败';
    publishBtn.classList.add('error');
    showError('网络错误：' + e.message);
    setTimeout(() => {
      publishBtn.disabled = false;
      publishBtn.textContent = origBtnText;
      publishBtn.className = '';
    }, 3000);
  }
});

// Shortcuts
editor.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') publishBtn.click();
});
editorEn.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') publishBtn.click();
});

switchTab('library');
</script>
