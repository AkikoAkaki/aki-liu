{{- $href := .href | default "/" -}}
{{- $label := .label | default (i18n "navHome") -}}
{{- $title := .title | default "" -}}
{{- $titleClass := .titleClass | default "" -}}

<div class="title-with-back">
    <a class="back-link" href="{{ $href }}">
        {{ partialCached "icons/back-arrow.html" "back-arrow" }}
        <span>{{ $label }}</span>
    </a>
    <h1 class="{{ $titleClass }}">{{ $title }}</h1>
</div>
