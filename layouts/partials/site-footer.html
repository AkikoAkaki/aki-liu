<footer class="site-footer">
    <div class="footer-content">
        {{- $connect := site.Data.homepage.connect -}}
        <div class="footer-grid">
            <div class="footer-contact">
                <h2 class="footer-label">{{ $connect.title }}</h2>
            </div>
            <div class="footer-links-container">
                <ul class="footer-links">
                    {{- range $connect.items }}
                    <li>
                        <span class="link-name">{{ .platform }}</span>
                        <span class="link-line"></span>
                        <a href="{{ .link }}" target="{{ if strings.HasPrefix .link "http" }}_blank{{ else }}_self{{ end }}"{{ if strings.HasPrefix .link "http" }} rel="noopener"{{ end }}>{{ .value }} <svg width="10" height="10" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 9.5L9.5 2.5M9.5 2.5V8.5M9.5 2.5H3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
                    </li>
                    {{- end }}
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <div class="footer-quote">
                "To sing you must first open your mouth"
            </div>
            <div class="footer-copyright-wrapper">
                <img src="{{ "images/signature.webp" | relURL }}" alt="AKI LIU" class="footer-signature" loading="lazy" width="208" height="118">
                <span class="footer-copyright">©{{ now.Year }} Aki Liu</span>
            </div>
        </div>
    </div>
</footer>
