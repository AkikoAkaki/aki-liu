<script>
document.addEventListener('DOMContentLoaded', function () {
    const tocs = document.querySelectorAll('.post-toc');
    if (!tocs.length) return;

    // Phase 4: Init Stagger & Indicator
    tocs.forEach(toc => {
        const nav = toc.querySelector('nav');
        if (nav && !nav.querySelector('.toc-indicator')) {
            const indicator = document.createElement('div');
            indicator.className = 'toc-indicator';
            nav.insertBefore(indicator, nav.firstChild);
        }
        
        // Assign index for Staggered Spring Reveal
        const listItems = toc.querySelectorAll('li');
        listItems.forEach((li, index) => {
            li.style.setProperty('--item-index', index);
        });
    });

    const links = Array.from(document.querySelectorAll('.post-toc a'));
    const headings = links
        .map((link) => {
            const id = link.getAttribute('href').slice(1);
            try {
                return document.getElementById(decodeURIComponent(id)) || document.getElementById(id);
            } catch(e) {
                return document.getElementById(id);
            }
        })
        .filter(Boolean);

    const scrollToHeading = (link) => {
        const id = link.getAttribute('href').slice(1);
        try {
            const target = document.getElementById(decodeURIComponent(id)) || document.getElementById(id);
            if (target) {
                const targetPosition = target.getBoundingClientRect().top + window.pageYOffset;
                const offsetPosition = targetPosition - window.innerHeight * 0.25;
                window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
            }
        } catch(e) {}
    };

    links.forEach((link) => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            scrollToHeading(link);
        });
    });

    const highlightActiveHeading = () => {
        let current = null;
        const scrollPos = window.scrollY + window.innerHeight * 0.26;

        for (let i = headings.length - 1; i >= 0; i--) {
            if (headings[i] && headings[i].offsetTop <= scrollPos) {
                current = headings[i];
                break;
            }
        }

        links.forEach((link) => link.classList.remove('is-active'));
        
        // Hide all indicators initially
        tocs.forEach(toc => {
            const indicator = toc.querySelector('.toc-indicator');
            if (indicator) indicator.classList.remove('visible');
        });

        if (current) {
            const currentIdDecoded = decodeURIComponent(current.id);
            const activeLinks = links.filter((link) => {
                const href = link.getAttribute('href');
                if (!href || !href.startsWith('#')) return false;
                try {
                    return decodeURIComponent(href.slice(1)) === currentIdDecoded;
                } catch(e) {
                    return href.slice(1) === current.id;
                }
            });
            
            activeLinks.forEach((link) => {
                link.classList.add('is-active');
                
                // Find the closest toc container and indicator
                const toc = link.closest('.post-toc');
                if (toc) {
                    const indicator = toc.querySelector('.toc-indicator');
                    if (indicator) {
                        // Use Range to get exact text node bounding box inside the link
                        const nav = link.closest('nav');
                        const navRect = nav.getBoundingClientRect();
                        
                        const range = document.createRange();
                        // Select the contents of the link to measure the text itself
                        range.selectNodeContents(link);
                        const textRect = range.getBoundingClientRect();
                        
                        // Calculate X and Y relative to the nav container
                        // Position dot 8px to the right of the text max width, and align with the top of the text + 4px down
                        const offsetLeft = textRect.right - navRect.left + nav.scrollLeft + 8;
                        const offsetTop = textRect.top - navRect.top + nav.scrollTop + 4;
                        
                        // Apply position with support for the liquid scaleY variable
                        indicator.style.transform = `translate(${offsetLeft}px, ${offsetTop}px) scaleY(var(--stretch, 1))`;
                        indicator.classList.add('visible');
                    }
                }
            });
        }
    };

    let ticking = false;
    const onScrollOrResize = () => {
        if (ticking) return;
        window.requestAnimationFrame(() => {
            highlightActiveHeading();
            ticking = false;
        });
        ticking = true;
    };

    window.addEventListener('scroll', onScrollOrResize);
    window.addEventListener('resize', onScrollOrResize);

    // Initial highlight
    setTimeout(highlightActiveHeading, 100);
    window.addEventListener('load', () => setTimeout(highlightActiveHeading, 150));

    // Phase 3: Liquid Morphing Engine
    let lastScrollY = window.scrollY;
    let velocity = 0;

    const animateLiquid = () => {
        const currentScrollY = window.scrollY;
        const delta = currentScrollY - lastScrollY;
        
        // Momentum decay (friction)
        velocity = velocity * 0.8 + delta * 0.2;
        lastScrollY = currentScrollY;

        // Calculate stretch multiplier (cap at 1.4 to prevent breaking layout)
        const stretchAmount = 1 + Math.min(Math.abs(velocity) * 0.008, 0.4);
        
        // Stretch from the direction of movement
        const stretchOrigin = velocity > 0 ? 'top' : 'bottom';

        tocs.forEach(toc => {
            const indicator = toc.querySelector('.toc-indicator');
            if (indicator && indicator.classList.contains('visible')) {
                // Only update variables if we have noticeable velocity or need to settle back to 1
                if (Math.abs(velocity) > 0.1 || stretchAmount > 1.001) {
                    indicator.style.setProperty('--stretch', stretchAmount.toFixed(3));
                    indicator.style.setProperty('--stretch-origin', stretchOrigin);
                } else {
                    indicator.style.setProperty('--stretch', '1');
                }
            }
        });

        requestAnimationFrame(animateLiquid);
    };
    
    // Start the 60fps liquid loop
    requestAnimationFrame(animateLiquid);

    // Phase 2: 3D Tilt Effect
    tocs.forEach(toc => {
        toc.addEventListener('mousemove', (e) => {
            // Get dimensions and position of the TOC panel
            const rect = toc.getBoundingClientRect();
            // Calculate mouse position relative to the center of the panel
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            // Calculate rotation amounts (max 10 degrees)
            const rotateX = ((y - centerY) / centerY) * -10;
            const rotateY = ((x - centerX) / centerX) * 10;
            
            toc.style.setProperty('--rotate-x', `${rotateX}deg`);
            toc.style.setProperty('--rotate-y', `${rotateY}deg`);
        });
        
        toc.addEventListener('mouseleave', () => {
            // Reset transforms when mouse leaves
            toc.style.setProperty('--rotate-x', `0deg`);
            toc.style.setProperty('--rotate-y', `0deg`);
        });
    });
});
</script>
