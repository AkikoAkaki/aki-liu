{{ define "main" }}
<section class="not-found">
    <span class="not-found-label">404</span>
    <h1 class="not-found-title">页面未找到。</h1>
    <p class="not-found-description">你访问的页面可能已移除，或输入的 URL 不正确。</p>
    <a class="not-found-link" href="{{ .Site.Home.RelPermalink }}">
        返回首页
        {{ partialCached "icons/forward-arrow.html" "forward-arrow" }}
    </a>
</section>
{{ end }}
